name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Disposable container: fixed /tmp paths in tests are isolated from any host.
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # The container runs as root by default. Several storage tests inject
      # write failures with chmod(read-only), which root bypasses; that made
      # "expected rejection" missing in CI. Run tests/build/pack as the image's
      # unprivileged `node` user so the fault injection is real, not skipped.
      - run: chown -R node:node .
      - run: su node -s /bin/bash -c 'npm test && npm run build && npm pack --dry-run'
