name: Quality
on:
  push:
    branches: [main, 'prep/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-check:
    name: Tests, build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare disposable dependency image
        run: docker build -f scripts/test.Dockerfile -t session-link-check .
      # Private-repository hosted runners provide 2 CPUs. A quota above the
      # runner capacity makes Docker refuse startup before any test can run.
      - name: Run without network, as non-root, on a private tmpfs
        run: >-
          docker run --rm --network=none --read-only --user=node
          --cap-drop=ALL --security-opt=no-new-privileges
          --pids-limit=512 --memory=3g --cpus=2
          --tmpfs /tmp:rw,nosuid,nodev,exec,size=1g,mode=1777
          session-link-check
  result:
    name: CI OK
    needs: [isolated-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every quality job
        env:
          CHECK: ${{ needs.isolated-check.result }}
        run: test "$CHECK" = success
# No pull_request_target, secrets, npm publish, production installation or
# repository-management permissions. Host-SDK integration skips are reported
# by the tests and must not be described as verified compatibility.
